# ci-workflows template actions/smoke v1.2.2 sha256:6cb6bc51f1338681b3f189fe87e560c94f1ffd3ec1a5db4aeecc5cbdf46a279c
# Vendored from Remeny-Farm/ci-workflows@b8805fb299c05afbc3032e1f9143c2958d2858a7 (v1.2.2): this repo cannot call the internal repo. Edit upstream, then re-copy.
name: Smoke
description: >-
  Playwright smoke of the pages listed in a smoke.json: status or redirect, selector, text,
  headers and a console error budget, in a mobile and a desktop viewport, behind a built-in
  prod guard. Uploads report.json and report.html. An infrastructure failure (Node, npm ci,
  Chromium download or launch) ends green with result tool-error, never as a failed smoke.

inputs:
  config:
    description: Path of the smoke config in the caller's workspace (schema version 1).
    required: false
    default: .monitoring/smoke.json
  base-url:
    description: >-
      Optional origin (scheme, host, port; no path) that replaces the config's `origin`.
      Controlled-failure proofs use https://monitoring-proof.invalid.
    required: false
    default: ''
  enabled:
    description: Anything other than 'true' skips the smoke with a warning, a summary line and a skipped marker (never red).
    required: false
    default: 'true'
  report-name:
    description: Name of the report directory (inside the workspace) and of the uploaded artifact.
    required: false
    default: smoke-report

outputs:
  result:
    description: >-
      passed, failed, skipped or tool-error (an infrastructure step or the Chromium launch
      failed; says nothing about the site).
    value: ${{ steps.run.outputs.result || steps.toolerr.outputs.result || steps.skip.outputs.result }}
  failures:
    description: Number of failing checks (0 when passed, skipped or tool-error).
    value: ${{ steps.run.outputs.failures || steps.toolerr.outputs.failures || steps.skip.outputs.failures }}
  failure-kinds:
    description: >-
      Comma-separated, sorted, unique kinds of the failing checks (dns, connection, timeout,
      request, http, content, console, guard, config, internal). Empty unless result is failed.
    value: ${{ steps.run.outputs.failure-kinds }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report-name }}
      run: |
        set -euo pipefail
        if [[ ! "$REPORT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "$REPORT_NAME" == *..* ]]; then
          echo "::error::report-name must match [A-Za-z0-9][A-Za-z0-9._-]* and must not contain '..'"
          exit 1
        fi

    - name: Skip (disabled)
      id: skip
      if: inputs.enabled != 'true'
      shell: bash
      env:
        MARKER_DIR: ${{ runner.temp }}/monitoring-result-smoke
      run: |
        set -euo pipefail
        echo "::warning::smoke skipped: disabled by the caller (MONITORING_SMOKE=off or enabled input)"
        echo "### Smoke: skipped" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Disabled by the caller (\`MONITORING_SMOKE=off\` or the \`enabled\` input). This is not a successful run." >> "$GITHUB_STEP_SUMMARY"
        mkdir -p "$MARKER_DIR"
        printf 'skipped\n' > "$MARKER_DIR/result.txt"
        {
          echo "result=skipped"
          echo "failures=0"
        } >> "$GITHUB_OUTPUT"

    - name: Upload skipped marker
      if: inputs.enabled != 'true'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: monitoring-result.smoke.skipped.${{ github.job }}.${{ github.run_attempt }}.${{ inputs.report-name }}
        path: ${{ runner.temp }}/monitoring-result-smoke/result.txt
        retention-days: 30
        overwrite: true
        if-no-files-found: error

    # The infrastructure steps carry continue-on-error: a failure there is not a verdict on the
    # site. The step "Detect a tool error" reads their outcomes and ends the action green with
    # result tool-error (warning, summary, marker artifact); the run step is then skipped.
    - name: Set up Node
      id: node
      if: inputs.enabled == 'true'
      continue-on-error: true
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Install smoke dependencies
      id: deps
      if: inputs.enabled == 'true' && steps.node.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        npm ci --ignore-scripts --no-audit --no-fund

    # Restore and save are separate steps: a failed Chromium install (tool-error, green job) must never
    # save a half-written browser directory under the key, or every later run would restore it.
    - name: Restore the Playwright browser cache
      id: browser-cache
      if: inputs.enabled == 'true' && steps.deps.outcome == 'success'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: pw-chromium-1.65.1-${{ runner.os }}-${{ runner.arch }}

    - name: Install Chromium
      id: browser
      if: inputs.enabled == 'true' && steps.deps.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        npx playwright install --with-deps chromium

    - name: Save the Playwright browser cache
      if: inputs.enabled == 'true' && steps.browser.outcome == 'success' && steps.browser-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: pw-chromium-1.65.1-${{ runner.os }}-${{ runner.arch }}

    - name: Detect a tool error
      id: toolerr
      if: inputs.enabled == 'true' && (steps.node.outcome == 'failure' || steps.deps.outcome == 'failure' || steps.browser.outcome == 'failure')
      shell: bash
      env:
        NODE_OUTCOME: ${{ steps.node.outcome }}
        DEPS_OUTCOME: ${{ steps.deps.outcome }}
        BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        MARKER_DIR: ${{ runner.temp }}/monitoring-result-smoke
      run: |
        set -euo pipefail
        failed=""
        [ "$NODE_OUTCOME" != failure ] || failed="${failed:+$failed, }setup-node"
        [ "$DEPS_OUTCOME" != failure ] || failed="${failed:+$failed, }npm ci"
        [ "$BROWSER_OUTCOME" != failure ] || failed="${failed:+$failed, }Chromium install"
        echo "::warning::smoke tool-error: ${failed} failed. The site was not checked; no incident is opened and this is not a successful run."
        {
          echo "### Smoke: tool-error"
          echo ""
          echo "The smoke tool failed, not the site: ${failed} failed, so no page was checked. No incident is opened. This is not a successful run; read the step log of the failed step."
        } >> "$GITHUB_STEP_SUMMARY"
        mkdir -p "$MARKER_DIR"
        printf 'tool-error\n' > "$MARKER_DIR/result.txt"
        {
          echo "result=tool-error"
          echo "failures=0"
        } >> "$GITHUB_OUTPUT"

    # smoke.mjs writes the report and the outputs and exits 1 on failures. The step
    # swallows that exit code so the report upload always runs first; the last step fails.
    # A Chromium launch failure inside smoke.mjs is a tool-error too (exit 0, marker written).
    - name: Run smoke
      id: run
      if: inputs.enabled == 'true' && steps.toolerr.outputs.result != 'tool-error'
      shell: bash
      env:
        SMOKE_CONFIG: ${{ inputs.config }}
        SMOKE_BASE_URL: ${{ inputs.base-url }}
        SMOKE_REPORT_NAME: ${{ inputs.report-name }}
        SMOKE_MARKER_DIR: ${{ runner.temp }}/monitoring-result-smoke
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/smoke.mjs" || echo "smoke.mjs exited with $?"
        # A crash before the runner wrote its outputs still has to read as failed.
        if ! grep -q '^result=' "$GITHUB_OUTPUT"; then
          {
            echo "result=failed"
            echo "failures=1"
            echo "failure-kinds=internal"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Upload smoke report
      id: upload
      if: ${{ !cancelled() && inputs.enabled == 'true' && steps.run.outcome != 'skipped' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.report-name }}
        retention-days: 30
        overwrite: true
        if-no-files-found: warn

    # A lost report is not a verdict on the site: the result stays as the run step set it.
    - name: Warn when the report upload failed
      if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
      shell: bash
      run: echo "::warning::smoke report upload failed; the result is unchanged (see the step log of Upload smoke report)"

    - name: Upload tool-error marker
      if: ${{ !cancelled() && inputs.enabled == 'true' && (steps.toolerr.outputs.result == 'tool-error' || steps.run.outputs.result == 'tool-error') }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: monitoring-result.smoke.tool-error.${{ github.job }}.${{ github.run_attempt }}.${{ inputs.report-name }}
        path: ${{ runner.temp }}/monitoring-result-smoke/result.txt
        retention-days: 30
        overwrite: true
        if-no-files-found: error

    - name: Fail on smoke failures
      if: inputs.enabled == 'true' && steps.run.outputs.result == 'failed'
      shell: bash
      env:
        RESULT: ${{ steps.run.outputs.result }}
        FAILURES: ${{ steps.run.outputs.failures }}
      run: |
        set -euo pipefail
        echo "::error::smoke ${RESULT:-failed} (${FAILURES:-unknown} failing check(s)); see the step summary and the report artifact"
        exit 1
