version: 2
updates:
  # a workflow-k SHA-ra pinnelt actionjeinek frissítése
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # npm: csak biztonsági frissítés-PR (verziófrissítés-PR nem nyílik)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # a biztonsági frissítések egy csoportosított PR-ben jönnek (ci-workflows v1.1.0 dependabot.yml)
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
