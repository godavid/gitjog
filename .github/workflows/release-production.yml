# Prod deploy a gitjog.remenyfarm.hu-ra. A prod deploy CSAK innen megy: a helyi
# `vercel --prod` tiltott, Vercel Git-integráció nincs (a Vercel GitHub-app nem
# fér hozzá a godavid fiókhoz). A main PR-hez kötött (biztonsag + CodeQL), ezért
# a main-re érkező push maga a zöld jel.
#
# Kézi vezérlés: `/deploy status|hold|resume` — a DEPLOY_HOLD repo-változó
# `true` értéke minden automatikus és kézi futást kihagy.
# Csak adatváltozáshoz nem kell deploy: a magyar-jog push-webhookja
# (/api/revalidate) frissíti a cache-t.
name: Release Production

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/szoveg/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build -> Deploy -> Smoke
    if: vars.DEPLOY_HOLD != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_V4TZ389jV2qcX1EBnIB2rmYh
      VERCEL_PROJECT_ID: prj_Z3XpAiid8p8Z4AbiG6B6maFT6EqL
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD_URL: https://gitjog.remenyfarm.hu
    steps:
      - name: Token megléte
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Hiányzik a VERCEL_TOKEN repo-secret (gitjog projektre szűkített Vercel-token)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Vercel CLI
        run: npm install --global vercel@59.11.1

      # A `vercel pull` helyett: a projektre szűkített token a team-adatot nem
      # olvashatja, és a pull ezen elhasal (csak a deploy tolerálja). Ugyanazt
      # írjuk ki, amit a pull: projektbeállítás + prod env, a sensitive értékek
      # helyén `[SENSITIVE]` (azok csak futásidőben léteznek).
      - name: Projektbeállítás és prod env
        run: |
          api() { curl -sSf -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          mkdir -p .vercel
          api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq --arg org "$VERCEL_ORG_ID" \
            '{projectId: .id, orgId: $org, settings: {createdAt, framework, devCommand, installCommand,
              buildCommand, outputDirectory, rootDirectory, directoryListing, nodeVersion}}' \
            > .vercel/project.json
          api "/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            | jq '[.envs[] | select(.type == "sensitive") | .key]' > "$RUNNER_TEMP/sensitive.json"
          api "/v3/env/pull/$VERCEL_PROJECT_ID/production?teamId=$VERCEL_ORG_ID&source=vercel-cli:pull" \
            | jq -r --slurpfile s "$RUNNER_TEMP/sensitive.json" '.env | to_entries[]
                | "\(.key)=\((if .value == "" and (.key | IN($s[0][])) then "[SENSITIVE]" else .value end) | @json)"' \
            > .vercel/.env.production.local

      # A monorepo gyökeréből: a projekt root directoryja apps/web, a
      # `workspace:*` függőséget csak így oldja fel (lásd docs/uzemeltetes.md).
      - name: Build
        run: vercel build --prod --yes --token "$VERCEL_TOKEN"

      - name: Deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "Deployment: $url"

      - name: Smoke
        run: |
          for ut in / /agenteknek /api/v1/openapi.json; do
            kod="$(curl -sS -o /dev/null -w '%{http_code}' "$PROD_URL$ut")"
            echo "$ut -> $kod"
            [ "$kod" = 200 ] || { echo "::error::$PROD_URL$ut: HTTP $kod"; exit 1; }
          done
