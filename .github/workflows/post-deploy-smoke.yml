# Vendored from Remeny-Farm/ci-workflows@8e0a535499cf9b1d956b91e38f89aea972083511 (v1.2.1): this repo cannot call the internal repo. Edit upstream, then re-copy.
name: Post-deploy smoke

# Reusable workflow around actions/smoke. Docs: docs/components/smoke.md.
# Caller job permissions: `contents: read` and `issues: write` (GitHub checks the nested
# red-issue job's permissions statically, so `issues: write` is needed even when
# `red-issue` is false).

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON text of the runs-on value of the secret-free smoke job, e.g.
          '["self-hosted","linux","ms-s1"]' or '"ubuntu-latest"'. Empty: vars.MONITORING_RUNNER,
          then "blacksmith-2vcpu-ubuntu-2404".
        type: string
        required: false
        default: ''
      write-runner:
        description: JSON text of the runs-on value of the red-issue job (it holds issues write).
        type: string
        required: false
        default: '"ubuntu-latest"'
      config:
        description: Path of the smoke config in the caller repository.
        type: string
        required: false
        default: .monitoring/smoke.json
      base-url:
        description: >-
          Optional origin that replaces the config's origin (controlled-failure proof:
          https://monitoring-proof.invalid).
        type: string
        required: false
        default: ''
      red-issue:
        description: Open or comment an issue on a red smoke and close it on the next green one.
        type: boolean
        required: false
        default: false
      issue-title:
        description: 'Exact title of the red issue. Empty means "post-deploy smoke: <owner/repo>".'
        type: string
        required: false
        default: ''
      issue-labels:
        description: Comma-separated labels of the red issue. They must already exist. Required when red-issue is true.
        type: string
        required: false
        default: ''
      report-name:
        description: >-
          Name of the report directory and of the uploaded artifact. Give every call of one
          workflow run (matrix, several origins) its own name, or the reports overwrite each other.
        type: string
        required: false
        default: smoke-report
      enabled:
        description: >-
          false skips the smoke (green, result skipped), like the MONITORING_SMOKE=off kill
          switch. The checkout still runs.
        type: boolean
        required: false
        default: true
    outputs:
      result:
        description: >-
          passed, failed, skipped or tool-error (an infrastructure step or the Chromium launch
          failed: no incident). Empty when the job broke before the smoke action ran.
        value: ${{ jobs.smoke.outputs.result }}
      failures:
        description: Number of failing checks (0 when passed, skipped or tool-error).
        value: ${{ jobs.smoke.outputs.failures }}
      failure-kinds:
        description: >-
          Comma-separated, sorted, unique kinds of the failing checks (dns, connection, timeout,
          request, http, content, console, guard, config, internal). Empty unless result is failed.
        value: ${{ jobs.smoke.outputs.failure-kinds }}
      issue:
        description: Number of the red issue that was opened, commented, closed or left open (empty when red-issue is off or its job failed).
        value: ${{ jobs.red-issue.outputs.issue }}
      issue-action:
        description: opened, commented, closed or none (empty when red-issue is off or its job failed).
        value: ${{ jobs.red-issue.outputs.action }}
      issue-state:
        description: >-
          State of the issue read back from GitHub after the red-issue job: open or closed, unknown
          when the read-back failed. Empty when there is no issue, red-issue is off or its job failed.
        value: ${{ jobs.red-issue.outputs.state }}

permissions: {}

jobs:
  smoke:
    name: smoke
    runs-on: ${{ fromJSON(inputs.runner || vars.MONITORING_RUNNER || '"blacksmith-2vcpu-ubuntu-2404"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.smoke.outputs.result }}
      failures: ${{ steps.smoke.outputs.failures }}
      failure-kinds: ${{ steps.smoke.outputs.failure-kinds }}
    steps:
      - name: Check inputs
        if: inputs.red-issue
        shell: bash
        env:
          ISSUE_LABELS: ${{ inputs.issue-labels }}
        run: |
          set -euo pipefail
          if [ -z "${ISSUE_LABELS//[[:space:],]/}" ]; then
            echo "::error::issue-labels is required when red-issue is true"
            exit 1
          fi

      # Unconditional: a caller that vendors this workflow points the Smoke step at a local
      # `./.github/actions/smoke`, which must exist even when the smoke is switched off.
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke
        id: smoke
        uses: ./.github/actions/smoke
        with:
          config: ${{ inputs.config }}
          base-url: ${{ inputs.base-url }}
          report-name: ${{ inputs.report-name }}
          enabled: ${{ inputs.enabled && vars.MONITORING_SMOKE != 'off' }}

  red-issue:
    name: red-issue
    needs: smoke
    if: ${{ always() && inputs.red-issue }}
    permissions:
      issues: write
      contents: read
    # Only a verdict reaches red-issue: passed -> success, failed -> failure. skipped (kill switch),
    # tool-error (infrastructure) and an empty result (the job broke before the action) pass through
    # unchanged and red-issue does nothing for them. Never needs.smoke.result: a failing
    # npm ci or Chromium download would open an incident on a healthy site.
    uses: ./.github/workflows/red-issue.yml
    with:
      title: "${{ inputs.issue-title || format('post-deploy smoke: {0}', github.repository) }}"
      labels: ${{ inputs.issue-labels }}
      result: ${{ needs.smoke.outputs.result == 'passed' && 'success' || needs.smoke.outputs.result == 'failed' && 'failure' || needs.smoke.outputs.result || 'unknown' }}
      sha: ${{ github.sha }}
      write-runner: ${{ inputs.write-runner }}
      body: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
